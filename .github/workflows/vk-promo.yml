name: Сбор промокодов из ВК

# Расписание в UTC, а живём мы по МСК (UTC+3) — перевода часов в РФ нет,
# так что сдвиг всегда ровно три часа:
#
#   06:00–13:40 UTC = 09:00–16:40 МСК, шаг 20 мин → 24 запуска
#   14:00–18:50 UTC = 17:00–21:50 МСК, шаг 10 мин → 30 запусков
#   19:00–20:40 UTC = 22:00–23:40 МСК, шаг 20 мин →  6 запусков
#
# Итого 60 запусков в сутки. Каждый job списывается округлённо вверх до
# минуты, то есть ~1860 минут за 31 день из 2000 бесплатных на аккаунт.
# Ночь (00:00–08:40 МСК) не проверяется: посты выходят днём, а утренний
# запуск в 09:00 подберёт всё, что появилось за ночь.
on:
  schedule:
    - cron: "*/20 6-13 * * *"
    - cron: "*/10 14-18 * * *"
    - cron: "*/20 19-20 * * *"
  workflow_dispatch:        # кнопка «Run workflow» для ручной проверки

# Запуски не должны наслаиваться: если прошлый ещё идёт, новый ждёт, а не
# дублирует запись в базу.
concurrency:
  group: vk-promo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Страховка от зависшего запроса: без неё job может висеть до шести
    # часов и в одиночку съесть треть месячного лимита.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-vkapi.txt

      - run: python vkapi.py --once
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
